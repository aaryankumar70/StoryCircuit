[project]
name = "reelforge"
version = "0.1.0"
description = "Zero-cost, scene-matched YouTube Shorts automation studio"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "edge-tts>=7.0.0",
    "pillow>=11.0.0",
    "numpy>=2.0.0",
    "requests>=2.32.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.1",
]

[project.scripts]
reelforge = "reelforge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
