<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CurioLoop Cartoon 3D Renderer</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101725; }
    body { display: grid; place-items: center; }
    #cv { display: block; width: auto; height: 100vh; aspect-ratio: 9 / 16; }
    #gl { display: none; }
    #play { position: fixed; z-index: 4; top: 46%; border: 2px solid #17202a; border-radius: 999px; padding: 16px 30px;
      background: #f1c960; color: #18222b; font: 800 24px Arial, sans-serif; box-shadow: 0 6px 24px #0008; cursor: pointer; }
    body.capture #cv { width: 1080px; height: 1920px; }
  </style>
  <script type="importmap">
    {"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}
  </script>
</head>
<body>
  <canvas id="cv" width="1080" height="1920"></canvas>
  <canvas id="gl"></canvas>
  <button id="play" hidden>▶ PLAY STORY</button>
  <script>if (location.search.includes('capture')) document.body.className = 'capture';</script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
