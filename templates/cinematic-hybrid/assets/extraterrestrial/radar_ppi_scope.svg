<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Cathode Ray PPI Radar Display -->
  <circle cx="300" cy="300" r="280" fill="#010e05" stroke="#1af55d" stroke-width="4"/>
  <!-- Range Rings -->
  <circle cx="300" cy="300" r="70" fill="none" stroke="#1af55d" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="300" cy="300" r="140" fill="none" stroke="#1af55d" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="300" cy="300" r="210" fill="none" stroke="#1af55d" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <!-- Azimuth Crosshairs -->
  <line x1="20" y1="300" x2="580" y2="300" stroke="#1af55d" stroke-width="1" opacity="0.4"/>
  <line x1="300" y1="20" x2="300" y2="580" stroke="#1af55d" stroke-width="1" opacity="0.4"/>
  <!-- Sweep Line with Phosphor Decay Wedge -->
  <path d="M300 300 L500 100 A280 280 0 0 0 420 40 Z" fill="#1af55d" opacity="0.25"/>
  <line x1="300" y1="300" x2="500" y2="100" stroke="#55ff88" stroke-width="3"/>
  <!-- Target Blip -->
  <circle cx="380" cy="180" r="7" fill="#ffffff"/>
  <circle cx="380" cy="180" r="14" fill="none" stroke="#1af55d" stroke-width="2"/>
  <text x="405" y="185" fill="#1af55d" font-family="'Courier New', monospace" font-size="14" font-weight="bold">TRK-092 [380kts]</text>
</svg>