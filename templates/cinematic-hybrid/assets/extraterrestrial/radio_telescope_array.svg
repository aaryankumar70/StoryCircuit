<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <!-- Parabolic Radio Telescope Dish Silhouette -->
  <!-- Support Tower Base -->
  <polygon points="560,550 640,550 615,350 585,350" fill="#06070a"/>
  <!-- Dish Cradle & Gimbal -->
  <rect x="575" y="330" width="50" height="25" fill="#090d14"/>
  <!-- Parabolic Dish Rim tilted toward stars -->
  <ellipse cx="600" cy="270" rx="220" ry="85" fill="#05080e" stroke="#00f0ff" stroke-width="2" transform="rotate(-18 600 270)"/>
  <!-- Feed Horn Support Struts -->
  <line x1="430" y1="220" x2="550" y2="120" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>
  <line x1="770" y1="320" x2="550" y2="120" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>
  <!-- Sub-reflector Feed Horn -->
  <circle cx="550" cy="120" r="14" fill="#00f0ff"/>
  <!-- Secondary background dish in distance -->
  <ellipse cx="280" cy="380" rx="110" ry="42" fill="#04060a" stroke="#00f0ff" stroke-width="1" opacity="0.4" transform="rotate(-18 280 380)"/>
  <polygon points="260,550 300,550 290,420 270,420" fill="#04060a" opacity="0.4"/>
</svg>