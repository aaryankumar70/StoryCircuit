      <stop offset="0%" stop-color="#141c2b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#070a10" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
