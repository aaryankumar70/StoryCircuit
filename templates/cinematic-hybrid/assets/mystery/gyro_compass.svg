<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="dialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#142330"/>
      <stop offset="90%" stop-color="#060b10"/>
      <stop offset="100%" stop-color="#020305"/>
    </radialGradient>
  </defs>
  <!-- Outer Bezel Ring -->
  <circle cx="250" cy="250" r="230" fill="#1b1c1e" stroke="#33373d" stroke-width="8"/>
  <circle cx="250" cy="250" r="215" fill="url(#dialGlow)" stroke="#0e1720" stroke-width="4"/>
  <!-- Degree Ticks -->
  <g stroke="#ffaa22" stroke-width="2" opacity="0.75">
    <line x1="250" y1="45" x2="250" y2="65"/>
    <line x1="250" y1="455" x2="250" y2="435"/>
    <line x1="45" y1="250" x2="65" y2="250"/>
    <line x1="455" y1="250" x2="435" y2="250"/>
  </g>
  <!-- Compass Cardinal Headings -->
  <text x="250" y="90" text-anchor="middle" fill="#ffaa22" font-family="'Courier New', monospace" font-size="24" font-weight="bold">N</text>
  <text x="250" y="425" text-anchor="middle" fill="#8899aa" font-family="'Courier New', monospace" font-size="20">S</text>
  <text x="420" y="258" text-anchor="middle" fill="#8899aa" font-family="'Courier New', monospace" font-size="20">E</text>
  <text x="80" y="258" text-anchor="middle" fill="#8899aa" font-family="'Courier New', monospace" font-size="20">W</text>
  <!-- Spinning Gyro Card Indicator -->
  <polygon points="250,110 238,250 262,250" fill="#e82020"/>
  <polygon points="250,390 238,250 262,250" fill="#778899"/>
  <circle cx="250" cy="250" r="14" fill="#ffaa22"/>
</svg>